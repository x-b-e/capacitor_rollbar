name: Publish GitHub package

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-package
  cancel-in-progress: false

jobs:
  verify-android:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Compile Android plugin against the client SDK
        run: |
          verification_root="$RUNNER_TEMP/rollbar-android"
          mkdir -p "$verification_root"
          printf 'android.useAndroidX=true\n' > "$verification_root/gradle.properties"
          npm install --prefix "$verification_root" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @capacitor/android@8.5.1 @capacitor/core@8.5.1
          cat > "$verification_root/settings.gradle" <<'GRADLE'
          rootProject.name = 'RollbarVerification'
          include ':capacitor-android'
          project(':capacitor-android').projectDir = new File(settingsDir, 'node_modules/@capacitor/android/capacitor')
          include ':capacitor-rollbar'
          project(':capacitor-rollbar').projectDir = new File(System.getenv('GITHUB_WORKSPACE'), 'android')
          GRADLE
          cat > "$verification_root/build.gradle" <<'GRADLE'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
          }
          ext {
              minSdkVersion = 26
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxAppCompatVersion = '1.7.1'
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          gradle -p "$verification_root" :capacitor-rollbar:assembleDebug

  verify-ios:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Use the client SDK for native verification
        run: |
          npm install --no-save --package-lock=false --legacy-peer-deps --ignore-scripts --no-audit --no-fund @capacitor/core@8.5.1 @capacitor/ios@8.5.1
          sed -i '' "s/platform :ios, '13.0'/platform :ios, '15.0'/" ios/Podfile
      - name: Install iOS dependencies
        working-directory: ios
        run: |
          pod install
          pod ipc spec ../ColensoCapacitorRollbar.podspec > ../podspec.json
          node -e "const fs = require('fs'); const crypto = require('crypto'); console.log('PODSPEC_CHECKSUM=' + crypto.createHash('sha1').update(fs.readFileSync('../podspec.json', 'utf8').trim()).digest('hex'));"
      - name: Compile iOS plugin
        working-directory: ios
        run: xcodebuild -workspace Plugin.xcworkspace -scheme Plugin -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO IPHONEOS_DEPLOYMENT_TARGET=15.0 build

  publish:
    needs: [verify-android, verify-ios]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          scope: '@x-b-e'
          cache: npm
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build package
        run: npm run build
      - name: Inspect published files
        run: npm pack --dry-run --ignore-scripts
      - name: Publish package
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
